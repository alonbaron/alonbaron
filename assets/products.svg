<svg width="910" height="275" viewBox="0 0 910 275" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">NUMRA and PawPals — live products by Alon Baron</title>
<desc id="d">Two live product cards side by side. Left: NUMRA, a Hebrew-first, server-authoritative real-time classroom math racing platform (React 19, Spring Boot 4, PostgreSQL, SSE, AWS). Right: PawPals, a full-stack social network for dog owners (React, Spring Boot, MySQL, JWT, Railway, Vercel).</desc>
<defs>
  <!-- NUMRA (left) -->
  <linearGradient id="n_bg" x1="0" y1="0" x2="445" y2="275" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0A101C"/><stop offset="1" stop-color="#081019"/>
  </linearGradient>
  <linearGradient id="n_nm" x1="34" y1="0" x2="300" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#5EEAD4"/><stop offset=".55" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/>
  </linearGradient>
  <linearGradient id="n_trk" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".6"/><stop offset="1" stop-color="#F59E0B" stop-opacity=".7"/>
  </linearGradient>
  <radialGradient id="n_gl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 30) scale(220 180)">
    <stop stop-color="#22D3EE" stop-opacity=".26"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
  </radialGradient>
  <pattern id="n_grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#22416B" stroke-width=".6" stroke-opacity=".4"/>
  </pattern>
  <filter id="n_gw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <clipPath id="n_card"><rect x="6" y="6" width="433" height="263" rx="16"/></clipPath>
  <!-- PawPals (right) -->
  <linearGradient id="p_bg" x1="0" y1="0" x2="445" y2="275" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0E0B1C"/><stop offset="1" stop-color="#140A1B"/>
  </linearGradient>
  <linearGradient id="p_nm" x1="34" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#A78BFA"/><stop offset=".55" stop-color="#E879F9"/><stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <radialGradient id="p_gl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 30) scale(220 180)">
    <stop stop-color="#A78BFA" stop-opacity=".26"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <pattern id="p_grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#3A2A55" stroke-width=".6" stroke-opacity=".45"/>
  </pattern>
  <filter id="p_gw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <clipPath id="p_card"><rect x="6" y="6" width="433" height="263" rx="16"/></clipPath>
  <style><![CDATA[
    .mono{font-family:ui-monospace,'Cascadia Code','Segoe UI Mono',Consolas,monospace}
    .sans{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
    .nmk{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;font-weight:800;font-size:46px}
    .dot{animation:p 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .ring{animation:r 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
    .r1{animation:race 3.4s cubic-bezier(.45,0,.55,1) infinite}
    .r2{animation:race 3.4s cubic-bezier(.45,0,.55,1) .9s infinite}
    .r3{animation:race 3.4s cubic-bezier(.45,0,.55,1) 1.7s infinite}
    .heart{animation:beat 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .e1{animation:flow 2.6s ease-in-out infinite}
    .e2{animation:flow 2.6s ease-in-out .5s infinite}
    .e3{animation:flow 2.6s ease-in-out 1s infinite}
    .e4{animation:flow 2.6s ease-in-out 1.5s infinite}
    @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
    @keyframes r{0%{opacity:.5;transform:scale(.7)}75%,100%{opacity:0;transform:scale(2.8)}}
    @keyframes race{0%{transform:translateX(0);opacity:0}10%{opacity:1}88%{opacity:1}100%{transform:translateX(330px);opacity:0}}
    @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.16)}28%{transform:scale(1)}}
    @keyframes flow{0%,100%{stroke-opacity:.2}50%{stroke-opacity:.9}}
    @media (prefers-reduced-motion:reduce){.dot,.ring,.r1,.r2,.r3,.heart,.e1,.e2,.e3,.e4{animation:none}.ring{opacity:0}.r1,.r2,.r3{opacity:1}}
  ]]></style>
</defs>

<!-- ============ NUMRA (left, x:0) ============ -->
<rect width="445" height="275" fill="url(#n_bg)"/>
<g clip-path="url(#n_card)">
  <rect width="445" height="275" fill="url(#n_grid)"/>
  <rect width="445" height="275" fill="url(#n_gl)"/>
</g>
<rect x="6" y="6" width="433" height="263" rx="16" fill="none" stroke="#1C3050"/>
<g stroke="#22D3EE" stroke-width="1.6" fill="none" stroke-linecap="round">
  <path d="M18 40V28a4 4 0 0 1 4-4h12"/>
  <path d="M427 40V28a4 4 0 0 0-4-4h-12"/>
  <path d="M18 235v12a4 4 0 0 0 4 4h12"/>
  <path d="M427 235v12a4 4 0 0 0-4 4h-12"/>
</g>
<g class="mono" font-size="11">
  <circle class="ring" cx="32" cy="40" r="4" fill="#34D399"/>
  <circle class="dot" cx="32" cy="40" r="4" fill="#34D399"/>
  <text x="44" y="44" fill="#34D399" font-weight="bold" letter-spacing="1.5">LIVE</text>
  <text x="413" y="44" text-anchor="end" fill="#5EEAD4" letter-spacing=".5">numra.co.il</text>
</g>
<text x="32" y="64" class="mono" font-size="11" letter-spacing="3" fill="#38BDF8">REAL-TIME · MULTIPLAYER</text>
<text x="30" y="118" class="nmk" letter-spacing="1.5" fill="url(#n_nm)">NUMRA</text>
<text x="32" y="142" class="sans" font-size="15" font-weight="600" fill="#CBD5E1">Real-time classroom math racing</text>
<text x="32" y="163" class="sans" font-size="12.5" fill="#7E8CA3">Server-authoritative engine · Hebrew-first</text>
<g>
  <line x1="34" y1="196" x2="404" y2="196" stroke="#1E3553" stroke-width="3" stroke-linecap="round"/>
  <line x1="34" y1="196" x2="404" y2="196" stroke="url(#n_trk)" stroke-width="1.6" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g transform="translate(404 188)"><rect x="-1" y="0" width="2" height="18" fill="#94A3B8"/>
    <rect x="1" y="0" width="5" height="4" fill="#E2E8F0"/><rect x="6" y="4" width="5" height="4" fill="#E2E8F0"/>
    <rect x="1" y="8" width="5" height="4" fill="#E2E8F0"/><rect x="1" y="4" width="5" height="4" fill="#475569"/><rect x="6" y="0" width="5" height="4" fill="#475569"/></g>
  <g transform="translate(40 196)"><g class="r1"><path d="M-6 -5L4 -5L9 0L4 5L-6 5L-1 0Z" fill="#22D3EE" filter="url(#n_gw)"/><path d="M-6 -5L4 -5L9 0L4 5L-6 5L-1 0Z" fill="#67E8F9"/></g></g>
  <g transform="translate(40 196)"><g class="r2"><path d="M-5 -4L3 -4L7 0L3 4L-5 4L-1 0Z" fill="#F59E0B"/></g></g>
  <g transform="translate(40 196)"><g class="r3"><path d="M-4 -3L2 -3L6 0L2 3L-4 3L-1 0Z" fill="#818CF8"/></g></g>
</g>
<text x="32" y="244" class="mono" font-size="11" fill="#8DA2C0">React 19<tspan fill="#3C4A63"> · </tspan>Spring Boot 4<tspan fill="#3C4A63"> · </tspan>PostgreSQL<tspan fill="#3C4A63"> · </tspan>SSE<tspan fill="#3C4A63"> · </tspan>AWS</text>

<!-- ============ PawPals (right, x:465) ============ -->
<g transform="translate(465,0)">
  <rect width="445" height="275" fill="url(#p_bg)"/>
  <g clip-path="url(#p_card)">
    <rect width="445" height="275" fill="url(#p_grid)"/>
    <rect width="445" height="275" fill="url(#p_gl)"/>
  </g>
  <rect x="6" y="6" width="433" height="263" rx="16" fill="none" stroke="#34244F"/>
  <g stroke="#C084FC" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M18 40V28a4 4 0 0 1 4-4h12"/>
    <path d="M427 40V28a4 4 0 0 0-4-4h-12"/>
    <path d="M18 235v12a4 4 0 0 0 4 4h12"/>
    <path d="M427 235v12a4 4 0 0 0-4 4h-12"/>
  </g>
  <g class="mono" font-size="11">
    <circle class="ring" cx="32" cy="40" r="4" fill="#34D399"/>
    <circle class="dot" cx="32" cy="40" r="4" fill="#34D399"/>
    <text x="44" y="44" fill="#34D399" font-weight="bold" letter-spacing="1.5">LIVE</text>
    <text x="413" y="44" text-anchor="end" fill="#D8B4FE" letter-spacing=".5">dogsocial.vercel.app</text>
  </g>
  <text x="32" y="64" class="mono" font-size="11" letter-spacing="3" fill="#C084FC">FULL-STACK · SOCIAL</text>
  <text x="30" y="118" class="nmk" letter-spacing=".5" fill="url(#p_nm)">PawPals</text>
  <text x="32" y="142" class="sans" font-size="15" font-weight="600" fill="#E2D9F3">A social network for dog owners</text>
  <text x="32" y="163" class="sans" font-size="12.5" fill="#9A8AB5">Profiles · posts · follows · playdates</text>
  <g transform="translate(0 4)">
    <g stroke="#C084FC">
      <path class="e1" d="M250 196 L312 178"/>
      <path class="e2" d="M312 178 L372 196"/>
      <path class="e3" d="M250 196 L318 210"/>
      <path class="e4" d="M318 210 L372 196"/>
    </g>
    <circle cx="250" cy="196" r="11" fill="#1E1730" stroke="#C084FC" stroke-width="1.4"/>
    <circle cx="372" cy="196" r="11" fill="#1E1730" stroke="#C084FC" stroke-width="1.4"/>
    <circle cx="318" cy="210" r="8" fill="#1E1730" stroke="#A78BFA" stroke-width="1.2"/>
    <circle cx="312" cy="178" r="7" fill="#1E1730" stroke="#A78BFA" stroke-width="1.2"/>
    <path class="heart" d="M311 192c-9-6-16-12-16-20 0-6 7-10 12-5 1 1 3 3 4 4 1-1 3-3 4-4 5-5 12-1 12 5 0 8-7 14-16 20z" fill="#F472B6" filter="url(#p_gw)"/>
    <path class="heart" d="M311 192c-9-6-16-12-16-20 0-6 7-10 12-5 1 1 3 3 4 4 1-1 3-3 4-4 5-5 12-1 12 5 0 8-7 14-16 20z" fill="#F472B6"/>
  </g>
  <text x="32" y="244" class="mono" font-size="11" fill="#A99BC4">React<tspan fill="#4A3D63"> · </tspan>Spring Boot<tspan fill="#4A3D63"> · </tspan>MySQL<tspan fill="#4A3D63"> · </tspan>JWT<tspan fill="#4A3D63"> · </tspan>Railway<tspan fill="#4A3D63"> · </tspan>Vercel</text>
</g>
</svg>
