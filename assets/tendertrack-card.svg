<svg width="900" height="210" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">TenderTrack — nightly grounded tender scanner across 31 Israeli public bodies</title>
<desc id="d">Dark telemetry card for TenderTrack, live in production for a paying customer. Nightly grounded Gemini scan across 31 Israeli public bodies (one request per body, never batched), verified by a second independent grounded check before entering the D1 database, with partial failures surfaced in red.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="210" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#050814"/>
    <stop offset=".5" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#0E1024"/>
  </linearGradient>
  <radialGradient id="gl" cx="720" cy="105" r="360" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#10B981" stop-opacity=".22"/>
    <stop offset=".55" stop-color="#125190" stop-opacity=".18"/>
    <stop offset="1" stop-color="#125190" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="nm" x1="30" y1="60" x2="290" y2="110" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#6EE7B7"/>
    <stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10B981" stop-opacity=".65"/>
    <stop offset=".5" stop-color="#38BDF8" stop-opacity=".35"/>
    <stop offset="1" stop-color="#4174A6" stop-opacity=".55"/>
  </linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#8DABCA" fill-opacity=".15"/>
  </pattern>
  <filter id="gw" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="900" height="210" rx="18"/></clipPath>
  <style><![CDATA[
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .sans { font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .nmk { font-family: 'Manrope', 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 38px; letter-spacing: .5px; }
    .dot { animation: p 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring { animation: r 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .flow { stroke-dasharray: 8 90; animation: f 2.8s linear infinite; }
    @keyframes p { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.75); } }
    @keyframes r { 0% { opacity: .65; transform: scale(.75); } 80%,100% { opacity: 0; transform: scale(2.8); } }
    @keyframes f { to { stroke-dashoffset: -98; } }
    @media (prefers-reduced-motion: reduce) { .dot, .ring, .flow { animation: none; } .ring { opacity: 0; } }
  ]]></style>
</defs>

<g clip-path="url(#card)">
  <rect width="900" height="210" fill="url(#bg)"/>
  <rect width="900" height="210" fill="url(#gl)"/>
  <rect width="900" height="210" fill="url(#dots)"/>

  <!-- Top Bar -->
  <g class="mono" font-size="10.5">
    <circle class="ring" cx="34" cy="32" r="4" fill="#10B981"/>
    <circle class="dot" cx="34" cy="32" r="4" fill="#10B981"/>
    <text x="46" y="36" fill="#34D399" font-weight="700" letter-spacing="1.5">STILL RUNNING · PAYING CUSTOMER</text>
    <text x="868" y="36" text-anchor="end" fill="#94A3B8">Client product — source private</text>
  </g>

  <!-- Left Identity -->
  <text x="30" y="62" class="mono" font-size="10" letter-spacing="2" fill="#38BDF8">◢ 31 ISRAELI PUBLIC BODIES · NIGHTLY GROUNDED SCAN</text>
  <text x="28" y="106" class="nmk" fill="url(#nm)">TenderTrack</text>
  <text x="30" y="132" class="sans" font-size="13.5" font-weight="600" fill="#E2E8F0">Two-pass independent grounded verification · deadline warnings</text>
  <text x="30" y="182" class="mono" font-size="11" font-weight="600" fill="#CBD5E1">
    <tspan fill="#34D399">Cloudflare Workers</tspan> · <tspan fill="#38BDF8">D1</tspan> · <tspan fill="#C084FC">Gemini</tspan> · <tspan fill="#FBBF24">Hebrew / RTL</tspan>
  </text>

  <!-- Right Verification Pipeline Diagram -->
  <g transform="translate(430 56)">
    <rect width="440" height="126" rx="14" fill="#0B132B" fill-opacity=".9" stroke="#1E293B"/>
    <line x1="56" y1="54" x2="384" y2="54" stroke="#1E293B" stroke-width="3"/>
    <path class="flow" d="M56 54 L384 54" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" filter="url(#gw)" fill="none"/>

    <!-- Stage 1 -->
    <g transform="translate(18 22)">
      <rect width="116" height="64" rx="10" fill="#131C38" stroke="#38BDF8" stroke-opacity=".55"/>
      <text x="58" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#7DD3FC">31 BODIES</text>
      <text x="58" y="38" text-anchor="middle" class="mono" font-size="9.5" fill="#E2E8F0">1 req per body</text>
      <text x="58" y="52" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">never batched</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(162 22)">
      <rect width="116" height="64" rx="10" fill="#131C38" stroke="#A855F7" stroke-opacity=".6"/>
      <text x="58" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#D8B4FE">2ND CHECK</text>
      <text x="58" y="38" text-anchor="middle" class="mono" font-size="9.5" fill="#E2E8F0">independent</text>
      <text x="58" y="52" text-anchor="middle" class="mono" font-size="9" fill="#94A3B8">grounded pass</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(306 22)">
      <rect width="116" height="64" rx="10" fill="#131C38" stroke="#10B981" stroke-opacity=".65"/>
      <text x="58" y="22" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#6EE7B7">D1 + ALERTS</text>
      <text x="58" y="38" text-anchor="middle" class="mono" font-size="9.5" fill="#E2E8F0">key in Worker</text>
      <text x="58" y="52" text-anchor="middle" class="mono" font-size="9" fill="#F87171">part-fail → red</text>
    </g>

    <text x="220" y="108" text-anchor="middle" class="mono" font-size="10" fill="#94A3B8">stops hallucinated tenders before they reach the database</text>
  </g>
</g>
<rect x="1" y="1" width="898" height="208" rx="17" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
