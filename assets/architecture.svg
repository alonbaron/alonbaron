<svg width="900" height="250" viewBox="0 0 900 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How Alon builds systems</title>
  <desc id="desc">A four-stage engineering loop: model, enforce, observe, evolve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset=".5" stop-color="#0B1728"/>
      <stop offset="1" stop-color="#0E1522"/>
    </linearGradient>
    <linearGradient id="line" x1="86" y1="0" x2="814" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".34" stop-color="#34D399"/>
      <stop offset=".68" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .flow { stroke-dasharray:7 10; animation:move 8s linear infinite; }
      @keyframes move { to { stroke-dashoffset:-68 } }
      @media (prefers-reduced-motion: reduce) { .flow { animation:none } }
    </style>
  </defs>
  <rect x="4" y="4" width="892" height="242" rx="22" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="890.5" height="240.5" rx="21.25" stroke="#475569" stroke-opacity=".48" stroke-width="1.5"/>
  <text x="38" y="42" class="mono" font-size="11" letter-spacing="1.5" fill="#64748B">ENGINEERING LOOP / FROM IDEA TO OPERABLE SYSTEM</text>

  <path d="M128 115H772" stroke="#26364B" stroke-width="4" stroke-linecap="round"/>
  <path class="flow" d="M128 115H772" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>

  <g class="sans">
    <g>
      <circle cx="128" cy="115" r="34" fill="#0B2134" stroke="#38BDF8"/>
      <text x="128" y="121" text-anchor="middle" font-size="19" font-weight="800" fill="#7DD3FC">01</text>
      <text x="128" y="174" text-anchor="middle" font-size="16" font-weight="750" fill="#E2E8F0">MODEL</text>
      <text x="128" y="194" text-anchor="middle" font-size="12" fill="#94A3B8">data · flows · invariants</text>
    </g>
    <g>
      <circle cx="343" cy="115" r="34" fill="#0C241F" stroke="#34D399"/>
      <text x="343" y="121" text-anchor="middle" font-size="19" font-weight="800" fill="#6EE7B7">02</text>
      <text x="343" y="174" text-anchor="middle" font-size="16" font-weight="750" fill="#E2E8F0">ENFORCE</text>
      <text x="343" y="194" text-anchor="middle" font-size="12" fill="#94A3B8">boundaries · rules · tests</text>
    </g>
    <g>
      <circle cx="557" cy="115" r="34" fill="#211A32" stroke="#A78BFA"/>
      <text x="557" y="121" text-anchor="middle" font-size="19" font-weight="800" fill="#C4B5FD">03</text>
      <text x="557" y="174" text-anchor="middle" font-size="16" font-weight="750" fill="#E2E8F0">OBSERVE</text>
      <text x="557" y="194" text-anchor="middle" font-size="12" fill="#94A3B8">errors · behavior · reality</text>
    </g>
    <g>
      <circle cx="772" cy="115" r="34" fill="#2A1E10" stroke="#F59E0B"/>
      <text x="772" y="121" text-anchor="middle" font-size="19" font-weight="800" fill="#FBBF24">04</text>
      <text x="772" y="174" text-anchor="middle" font-size="16" font-weight="750" fill="#E2E8F0">EVOLVE</text>
      <text x="772" y="194" text-anchor="middle" font-size="12" fill="#94A3B8">small · legible · reversible</text>
    </g>
  </g>
</svg>
