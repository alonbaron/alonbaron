<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">Alon's build loop: model, enforce, observe, evolve</title>
<desc id="d">A four-stage architecture loop with an animated pulse: 01 Model (data, flows, invariants), 02 Enforce (business rules at the core), 03 Observe (failure paths, edge cases, load), 04 Evolve (small, reversible changes).</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="240" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#050814"/>
    <stop offset=".5" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#0E1024"/>
  </linearGradient>
  <radialGradient id="gC" cx="180" cy="120" r="320" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#125190" stop-opacity=".38"/>
    <stop offset="1" stop-color="#125190" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gM" cx="740" cy="120" r="320" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".28"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rail" x1="125" y1="0" x2="775" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#06B6D4"/>
    <stop offset=".34" stop-color="#38BDF8"/>
    <stop offset=".67" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#EC4899"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38BDF8" stop-opacity=".6"/>
    <stop offset=".5" stop-color="#4174A6" stop-opacity=".28"/>
    <stop offset="1" stop-color="#EC4899" stop-opacity=".55"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#8DABCA" fill-opacity=".16"/>
  </pattern>
  <filter id="gw" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#02040A" flood-opacity=".6"/>
  </filter>
  <clipPath id="card"><rect width="900" height="240" rx="20"/></clipPath>
  <style><![CDATA[
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .sans { font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .flow { stroke-dasharray: 14 220; animation: f 3.4s linear infinite; }
    .flowBack { stroke-dasharray: 10 260; animation: fb 4.2s linear infinite; }
    @keyframes f { to { stroke-dashoffset: -234; } }
    @keyframes fb { to { stroke-dashoffset: 270; } }
    @media (prefers-reduced-motion: reduce) { .flow, .flowBack { animation: none; } }
  ]]></style>
</defs>

<g clip-path="url(#card)">
  <rect width="900" height="240" fill="url(#bg)"/>
  <rect width="900" height="240" fill="url(#gC)"/>
  <rect width="900" height="240" fill="url(#gM)"/>
  <rect width="900" height="240" fill="url(#dots)"/>

  <!-- Header -->
  <text x="34" y="36" class="mono" font-size="11" font-weight="700" letter-spacing="2.2" fill="#38BDF8">◢ HOW I BUILD · ALON'S BUILD LOOP</text>
  <text x="866" y="36" text-anchor="end" class="mono" font-size="11" letter-spacing="1.2" fill="#94A3B8">BUILD THE MODEL · DEFINE THE RULES · WRITE THE CODE</text>
  <line x1="34" y1="48" x2="866" y2="48" stroke="#1E293B"/>

  <!-- Forward Conduit + Return Feedback Arc -->
  <line x1="125" y1="118" x2="775" y2="118" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
  <line x1="125" y1="118" x2="775" y2="118" stroke="url(#rail)" stroke-width="2" stroke-dasharray="3 6"/>
  <path class="flow" d="M125 118 L775 118" stroke="url(#rail)" stroke-width="3.5" stroke-linecap="round" filter="url(#gw)" fill="none"/>

  <path d="M775 156 C620 218, 280 218, 125 156" stroke="#4174A6" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <path class="flowBack" d="M775 156 C620 218, 280 218, 125 156" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" filter="url(#gw)" fill="none"/>

  <!-- Stage 01: MODEL -->
  <g transform="translate(34 68)" filter="url(#shadow)">
    <rect width="182" height="114" rx="14" fill="#111A34" stroke="#06B6D4" stroke-opacity=".7" stroke-width="1.5"/>
    <line x1="14" y1="1.5" x2="168" y2="1.5" stroke="#FFFFFF" stroke-opacity=".28"/>
    <circle cx="32" cy="30" r="14" fill="#06B6D4" fill-opacity=".18" stroke="#06B6D4"/>
    <text x="32" y="34.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#22D3EE">01</text>
    <text x="56" y="35" class="sans" font-size="15" font-weight="800" letter-spacing="1.2" fill="#F8FAFC">MODEL</text>
    <text x="18" y="66" class="mono" font-size="11" fill="#7DD3FC">data · flows · invariants</text>
    <text x="18" y="86" class="sans" font-size="11.5" fill="#94A3B8">Before framework choices</text>
  </g>

  <!-- Stage 02: ENFORCE -->
  <g transform="translate(251 68)" filter="url(#shadow)">
    <rect width="182" height="114" rx="14" fill="#111A34" stroke="#38BDF8" stroke-opacity=".7" stroke-width="1.5"/>
    <line x1="14" y1="1.5" x2="168" y2="1.5" stroke="#FFFFFF" stroke-opacity=".28"/>
    <circle cx="32" cy="30" r="14" fill="#38BDF8" fill-opacity=".18" stroke="#38BDF8"/>
    <text x="32" y="34.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#38BDF8">02</text>
    <text x="56" y="35" class="sans" font-size="15" font-weight="800" letter-spacing="1.2" fill="#F8FAFC">ENFORCE</text>
    <text x="18" y="66" class="mono" font-size="11" fill="#BAE6FD">rules at the core</text>
    <text x="18" y="86" class="sans" font-size="11.5" fill="#94A3B8">Guarded and tested</text>
  </g>

  <!-- Stage 03: OBSERVE -->
  <g transform="translate(468 68)" filter="url(#shadow)">
    <rect width="182" height="114" rx="14" fill="#111A34" stroke="#8B5CF6" stroke-opacity=".7" stroke-width="1.5"/>
    <line x1="14" y1="1.5" x2="168" y2="1.5" stroke="#FFFFFF" stroke-opacity=".28"/>
    <circle cx="32" cy="30" r="14" fill="#8B5CF6" fill-opacity=".18" stroke="#8B5CF6"/>
    <text x="32" y="34.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#C084FC">03</text>
    <text x="56" y="35" class="sans" font-size="15" font-weight="800" letter-spacing="1.2" fill="#F8FAFC">OBSERVE</text>
    <text x="18" y="66" class="mono" font-size="11" fill="#DDD6FE">failure paths · load</text>
    <text x="18" y="86" class="sans" font-size="11.5" fill="#94A3B8">Edge cases &amp; deadlines</text>
  </g>

  <!-- Stage 04: EVOLVE -->
  <g transform="translate(684 68)" filter="url(#shadow)">
    <rect width="182" height="114" rx="14" fill="#111A34" stroke="#EC4899" stroke-opacity=".7" stroke-width="1.5"/>
    <line x1="14" y1="1.5" x2="168" y2="1.5" stroke="#FFFFFF" stroke-opacity=".28"/>
    <circle cx="32" cy="30" r="14" fill="#EC4899" fill-opacity=".18" stroke="#EC4899"/>
    <text x="32" y="34.5" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#F472B6">04</text>
    <text x="56" y="35" class="sans" font-size="15" font-weight="800" letter-spacing="1.2" fill="#F8FAFC">EVOLVE</text>
    <text x="18" y="66" class="mono" font-size="11" fill="#FBCFE8">small · reversible</text>
    <text x="18" y="86" class="sans" font-size="11.5" fill="#94A3B8">Over impressive rewrites</text>
  </g>

  <text x="450" y="222" text-anchor="middle" class="mono" font-size="10.5" fill="#7DD3FC">measured instead of just trusted · AI for speed, human judgment in charge</text>
</g>
<rect x="1" y="1" width="898" height="238" rx="19" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
