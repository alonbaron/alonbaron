<svg width="445" height="275" viewBox="0 0 445 275" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">NUMRA — real-time classroom math racing</title>
<desc id="d">Light-mode product card for NUMRA, marked shipped and offline. NUMRA is a Hebrew-first, server-authoritative real-time classroom math racing platform built with React 19, Spring Boot 4, PostgreSQL, SSE and AWS.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="445" y2="275" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F6F7FB"/>
    <stop offset="1" stop-color="#E9EFF8"/>
  </linearGradient>
  <radialGradient id="gl" cx="360" cy="50" r="220" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8DABCA" stop-opacity=".40"/>
    <stop offset="1" stop-color="#8DABCA" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".90"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".75"/>
  </linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#0E1024" fill-opacity=".07"/>
  </pattern>
  <clipPath id="clip"><rect width="445" height="275" rx="20"/></clipPath>
  <style><![CDATA[
    .sans { font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace; }
    .r1 { animation: race 3.2s cubic-bezier(.45,0,.55,1) infinite; }
    .r2 { animation: race 3.2s cubic-bezier(.45,0,.55,1) .8s infinite; }
    @keyframes race { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(310px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .r1, .r2 { animation: none; opacity: 1; } }
  ]]></style>
</defs>

<g clip-path="url(#clip)">
  <rect width="445" height="275" fill="url(#bg)"/>
  <rect width="445" height="275" fill="url(#gl)"/>
  <rect width="445" height="275" fill="url(#dots)"/>

  <g transform="translate(24 22)">
    <rect width="176" height="24" rx="12" fill="#FFFFFF" stroke="#8DABCA" stroke-opacity=".5"/>
    <circle cx="14" cy="12" r="3.5" fill="#125190"/>
    <text x="25" y="16" class="mono" font-size="10" font-weight="700" fill="#125190">REAL-TIME · MULTIPLAYER</text>

    <rect x="332" y="0" width="65" height="24" rx="12" fill="#EEF2F8" stroke="#CBD5E1"/>
    <text x="364.5" y="15.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#545A75">offline</text>

    <text x="0" y="68" class="sans" font-size="38" font-weight="900" letter-spacing="-1" fill="#0E1024">NUMRA</text>
    <text x="0" y="92" class="sans" font-size="14.5" font-weight="700" fill="#125190">Real-time classroom math racing</text>
    <text x="0" y="112" class="sans" font-size="12.5" fill="#545A75">Server-authoritative engine · Hebrew-first</text>

    <!-- Frosted Glass Telemetry Track Box -->
    <g transform="translate(0 126)">
      <rect width="397" height="62" rx="14" fill="url(#glass)" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x=".75" y=".75" width="395.5" height="60.5" rx="13.25" fill="none" stroke="#125190" stroke-opacity=".12"/>
      <text x="16" y="20" class="mono" font-size="9.5" font-weight="700" fill="#545A75">SERVER-AUTHORITATIVE STATE · SCORING · CATCH-UP · RANKINGS</text>
      <line x1="16" y1="34" x2="365" y2="34" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="46" x2="365" y2="46" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 6"/>
      <g transform="translate(20 34)"><g class="r1"><circle r="4.5" fill="#125190"/></g></g>
      <g transform="translate(20 46)"><g class="r2"><circle r="4" fill="#4174A6"/></g></g>
      <rect x="372" y="28" width="6" height="24" rx="2" fill="#125190"/>
    </g>

    <text x="0" y="216" class="mono" font-size="11" font-weight="600" fill="#0E1024">React 19 <tspan fill="#8DABCA">·</tspan> Spring Boot 4 <tspan fill="#8DABCA">·</tspan> PostgreSQL <tspan fill="#8DABCA">·</tspan> SSE <tspan fill="#8DABCA">·</tspan> AWS</text>
  </g>
</g>
<rect x=".75" y=".75" width="443.5" height="273.5" rx="19.25" fill="none" stroke="#D5E0F0" stroke-width="1.5"/>
</svg>