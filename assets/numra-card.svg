<svg width="445" height="260" viewBox="0 0 445 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NUMRA</title>
  <desc id="desc">A live, Hebrew-first, real-time classroom math racing platform.</desc>
  <defs>
    <linearGradient id="bg" x1="20" y1="10" x2="425" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08172A"/>
      <stop offset="1" stop-color="#10213B"/>
    </linearGradient>
    <linearGradient id="track" x1="40" y1="0" x2="405" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38BDF8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .runner { animation: race 6s ease-in-out infinite; }
      @keyframes race { 0%,100% { transform:translateX(0) } 50% { transform:translateX(44px) } }
      @media (prefers-reduced-motion: reduce) { .runner { animation:none } }
    </style>
  </defs>
  <rect x="4" y="4" width="437" height="252" rx="20" fill="url(#bg)"/>
  <circle cx="390" cy="20" r="125" fill="url(#glow)"/>
  <rect x="4.75" y="4.75" width="435.5" height="250.5" rx="19.25" stroke="#38BDF8" stroke-opacity=".55" stroke-width="1.5"/>

  <g class="sans">
    <rect x="26" y="24" width="111" height="27" rx="13.5" fill="#0D2A2A" stroke="#34D399" stroke-opacity=".5"/>
    <circle cx="42" cy="37.5" r="4" fill="#34D399"/>
    <text x="54" y="42" font-size="11" font-weight="700" letter-spacing="1" fill="#6EE7B7">LIVE PRODUCT</text>
    <text x="26" y="94" font-size="39" font-weight="800" letter-spacing="1.5" fill="#F8FAFC">NUMRA</text>
    <text x="26" y="119" font-size="15" font-weight="600" fill="#7DD3FC">Real-time classroom math racing</text>
    <text x="26" y="146" font-size="13" fill="#CBD5E1">Server-authoritative gameplay · Hebrew-first</text>
    <text x="26" y="166" font-size="13" fill="#94A3B8">Built for fairness, classrooms, and live state.</text>
  </g>

  <path d="M29 197H411" stroke="#334155" stroke-width="2"/>
  <path d="M29 197H411" stroke="url(#track)" stroke-width="2" stroke-dasharray="5 10"/>
  <g class="runner">
    <path d="M71 185L84 185L92 192L87 199H61L57 194L63 185H71Z" fill="#F59E0B"/>
    <circle cx="66" cy="200" r="4" fill="#0F172A" stroke="#FBBF24"/>
    <circle cx="84" cy="200" r="4" fill="#0F172A" stroke="#FBBF24"/>
  </g>

  <g class="mono" font-size="10.5">
    <rect x="26" y="216" width="74" height="23" rx="6" fill="#0A2034"/><text x="63" y="231" text-anchor="middle" fill="#7DD3FC">React 19</text>
    <rect x="106" y="216" width="94" height="23" rx="6" fill="#0A2034"/><text x="153" y="231" text-anchor="middle" fill="#7DD3FC">Spring Boot 4</text>
    <rect x="206" y="216" width="82" height="23" rx="6" fill="#0A2034"/><text x="247" y="231" text-anchor="middle" fill="#7DD3FC">PostgreSQL</text>
    <rect x="294" y="216" width="44" height="23" rx="6" fill="#0A2034"/><text x="316" y="231" text-anchor="middle" fill="#7DD3FC">SSE</text>
    <rect x="344" y="216" width="67" height="23" rx="6" fill="#0A2034"/><text x="377.5" y="231" text-anchor="middle" fill="#7DD3FC">AWS</text>
  </g>
</svg>
