<svg width="445" height="285" viewBox="0 0 445 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">NUMRA — real-time classroom math racing</title>
<desc id="d">Dark telemetry product card for NUMRA, marked shipped and offline. NUMRA is a Hebrew-first, server-authoritative real-time classroom math racing platform built with React 19, Spring Boot 4, PostgreSQL, SSE, AWS EC2/RDS, Docker and Caddy.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="445" y2="285" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#050814"/>
    <stop offset=".55" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#0E1024"/>
  </linearGradient>
  <radialGradient id="gl" cx="350" cy="60" r="260" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0891B2" stop-opacity=".38"/>
    <stop offset=".5" stop-color="#125190" stop-opacity=".18"/>
    <stop offset="1" stop-color="#125190" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="nm" x1="28" y1="80" x2="260" y2="130" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".45" stop-color="#7DD3FC"/>
    <stop offset="1" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38BDF8" stop-opacity=".6"/>
    <stop offset=".5" stop-color="#4174A6" stop-opacity=".25"/>
    <stop offset="1" stop-color="#6366F1" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="trk" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#125190" stop-opacity=".2"/>
    <stop offset=".5" stop-color="#38BDF8" stop-opacity=".85"/>
    <stop offset="1" stop-color="#F59E0B" stop-opacity=".95"/>
  </linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#8DABCA" fill-opacity=".16"/>
  </pattern>
  <filter id="gw" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="445" height="285" rx="18"/></clipPath>
  <style><![CDATA[
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .sans { font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .nmk { font-family: 'Manrope', 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 44px; letter-spacing: 1px; }
    .r1 { animation: race 3.2s cubic-bezier(.45,0,.55,1) infinite; }
    .r2 { animation: race 3.2s cubic-bezier(.45,0,.55,1) .85s infinite; }
    .r3 { animation: race 3.2s cubic-bezier(.45,0,.55,1) 1.65s infinite; }
    @keyframes race { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(342px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .r1, .r2, .r3 { animation: none; opacity: 1; } }
  ]]></style>
</defs>

<g clip-path="url(#card)">
  <rect width="445" height="285" fill="url(#bg)"/>
  <rect width="445" height="285" fill="url(#gl)"/>
  <rect width="445" height="285" fill="url(#dots)"/>

  <!-- HUD Corner Brackets -->
  <g stroke="#38BDF8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-opacity=".8">
    <path d="M16 36V22a4 4 0 0 1 4-4h14"/>
    <path d="M411 18h14a4 4 0 0 1 4 4v14"/>
    <path d="M429 249v14a4 4 0 0 1-4 4h-14"/>
    <path d="M34 267H20a4 4 0 0 1-4-4v-14"/>
  </g>

  <!-- Top Bar -->
  <g class="mono" font-size="10.5">
    <circle cx="30" cy="34" r="3.5" fill="#38BDF8"/>
    <text x="42" y="38" fill="#7DD3FC" font-weight="700" letter-spacing="1.5">SHIPPED · PRODUCTION</text>
    <rect x="358" y="23" width="58" height="20" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="387" y="36.5" text-anchor="middle" fill="#94A3B8" font-size="10">offline</text>
  </g>

  <!-- Identity -->
  <text x="28" y="64" class="mono" font-size="10.5" letter-spacing="2.2" fill="#38BDF8">◢ SERVER-AUTHORITATIVE · HEBREW-FIRST</text>
  <text x="26" y="114" class="nmk" fill="url(#nm)">NUMRA</text>
  <text x="28" y="138" class="sans" font-size="15" font-weight="700" fill="#F8FAFC">Real-time classroom math racing</text>
  <text x="28" y="158" class="mono" font-size="10.5" fill="#94A3B8">scoring · difficulty · power-ups · routes · catch-up · rankings</text>

  <!-- Multi-Lane Telemetry Race HUD -->
  <g transform="translate(28 174)">
    <rect width="389" height="52" rx="10" fill="#0B132B" fill-opacity=".85" stroke="#1E293B"/>
    <line x1="14" y1="16" x2="365" y2="16" stroke="#1E293B" stroke-width="2"/>
    <line x1="14" y1="26" x2="365" y2="26" stroke="url(#trk)" stroke-width="2" stroke-dasharray="3 6"/>
    <line x1="14" y1="36" x2="365" y2="36" stroke="#1E293B" stroke-width="2"/>

    <!-- Finish Gate -->
    <g transform="translate(366 10)">
      <rect x="0" y="0" width="4" height="32" rx="1" fill="#38BDF8" opacity=".8"/>
      <rect x="6" y="0" width="4" height="8" fill="#F8FAFC"/><rect x="6" y="16" width="4" height="8" fill="#F8FAFC"/>
      <rect x="6" y="8" width="4" height="8" fill="#334155"/><rect x="6" y="24" width="4" height="8" fill="#334155"/>
    </g>

    <!-- Animated Racers -->
    <g transform="translate(18 16)"><g class="r1"><path d="M-6 -4L5 -4L10 0L5 4L-6 4L-2 0Z" fill="#38BDF8" filter="url(#gw)"/></g></g>
    <g transform="translate(18 26)"><g class="r2"><path d="M-5 -3.5L4 -3.5L8 0L4 3.5L-5 3.5L-1.5 0Z" fill="#F59E0B" filter="url(#gw)"/></g></g>
    <g transform="translate(18 36)"><g class="r3"><path d="M-5 -3.5L4 -3.5L8 0L4 3.5L-5 3.5L-1.5 0Z" fill="#A855F7" filter="url(#gw)"/></g></g>
  </g>

  <!-- Tech Stack Strip -->
  <text x="28" y="252" class="mono" font-size="10.5" font-weight="600" fill="#CBD5E1">
    <tspan fill="#38BDF8">React 19</tspan> · <tspan fill="#38BDF8">Spring Boot 4</tspan> · <tspan fill="#6EE7B7">PostgreSQL</tspan> · <tspan fill="#FBBF24">SSE</tspan> · AWS EC2/RDS · Docker · Caddy
  </text>
</g>
<rect x="1" y="1" width="443" height="283" rx="17" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
