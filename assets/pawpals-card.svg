<svg width="445" height="285" viewBox="0 0 445 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">PawPals — a social network for dog owners</title>
<desc id="d">Dark telemetry product card for PawPals, marked shipped and offline. PawPals is a full-stack social network for dog owners with user and dog profiles, posts, follows, reactions, image uploads and playdate scheduling, built with React, Spring Boot, MySQL, JWT, Railway and Vercel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="445" y2="285" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#050814"/>
    <stop offset=".55" stop-color="#0B0F26"/>
    <stop offset="1" stop-color="#120E29"/>
  </linearGradient>
  <radialGradient id="gl" cx="350" cy="60" r="260" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#A855F7" stop-opacity=".36"/>
    <stop offset=".5" stop-color="#EC4899" stop-opacity=".16"/>
    <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="nm" x1="28" y1="80" x2="260" y2="130" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".45" stop-color="#E9D5FF"/>
    <stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A855F7" stop-opacity=".6"/>
    <stop offset=".5" stop-color="#4174A6" stop-opacity=".25"/>
    <stop offset="1" stop-color="#EC4899" stop-opacity=".6"/>
  </linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#C4B5FD" fill-opacity=".15"/>
  </pattern>
  <filter id="gw" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="445" height="285" rx="18"/></clipPath>
  <style><![CDATA[
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .sans { font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .nmk { font-family: 'Manrope', 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 44px; letter-spacing: .5px; }
    .flow { stroke-dasharray: 6 60; animation: f 2.4s linear infinite; }
    .pulse { animation: beat 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes f { to { stroke-dashoffset: -66; } }
    @keyframes beat { 0%,100% { transform: scale(1); } 20% { transform: scale(1.18); } 40% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  ]]></style>
</defs>

<g clip-path="url(#card)">
  <rect width="445" height="285" fill="url(#bg)"/>
  <rect width="445" height="285" fill="url(#gl)"/>
  <rect width="445" height="285" fill="url(#dots)"/>

  <!-- HUD Corner Brackets -->
  <g stroke="#C084FC" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-opacity=".8">
    <path d="M16 36V22a4 4 0 0 1 4-4h14"/>
    <path d="M411 18h14a4 4 0 0 1 4 4v14"/>
    <path d="M429 249v14a4 4 0 0 1-4 4h-14"/>
    <path d="M34 267H20a4 4 0 0 1-4-4v-14"/>
  </g>

  <!-- Top Bar -->
  <g class="mono" font-size="10.5">
    <circle cx="30" cy="34" r="3.5" fill="#C084FC"/>
    <text x="42" y="38" fill="#E9D5FF" font-weight="700" letter-spacing="1.5">SHIPPED · OPEN SOURCE</text>
    <rect x="358" y="23" width="58" height="20" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="387" y="36.5" text-anchor="middle" fill="#94A3B8" font-size="10">offline</text>
  </g>

  <!-- Identity -->
  <text x="28" y="64" class="mono" font-size="10.5" letter-spacing="2.2" fill="#F472B6">◢ FULL-STACK · RELATIONAL MODELING</text>
  <text x="26" y="114" class="nmk" fill="url(#nm)">PawPals</text>
  <text x="28" y="138" class="sans" font-size="15" font-weight="700" fill="#F8FAFC">A social network for dog owners</text>
  <text x="28" y="158" class="mono" font-size="10.5" fill="#94A3B8">profiles · posts · follows · reactions · uploads · playdates</text>

  <!-- Relational Graph & Concurrency HUD -->
  <g transform="translate(28 174)">
    <rect width="389" height="52" rx="10" fill="#0B132B" fill-opacity=".85" stroke="#1E293B"/>
    <!-- Graph Edges -->
    <g stroke="#6B21A8" stroke-width="1.5" fill="none">
      <path d="M36 26 C85 10, 130 10, 180 26"/>
      <path d="M36 26 C85 42, 130 42, 180 26"/>
      <path d="M180 26 C235 12, 290 12, 348 26"/>
      <path class="flow" d="M36 26 C85 10, 130 10, 180 26" stroke="#EC4899" stroke-width="2" filter="url(#gw)"/>
      <path class="flow" d="M180 26 C235 12, 290 12, 348 26" stroke="#A855F7" stroke-width="2" filter="url(#gw)"/>
    </g>
    <!-- Nodes -->
    <circle cx="36" cy="26" r="9" fill="#131C38" stroke="#A855F7" stroke-width="1.6"/>
    <circle cx="36" cy="26" r="3" fill="#E9D5FF"/>

    <circle class="pulse" cx="180" cy="26" r="11" fill="#131C38" stroke="#EC4899" stroke-width="1.8" filter="url(#gw)"/>
    <circle cx="180" cy="26" r="4" fill="#F472B6"/>

    <circle cx="348" cy="26" r="9" fill="#131C38" stroke="#38BDF8" stroke-width="1.6"/>
    <circle cx="348" cy="26" r="3" fill="#7DD3FC"/>

    <text x="64" y="30" class="mono" font-size="9.5" fill="#CBD5E1">auth · ownership</text>
    <text x="206" y="30" class="mono" font-size="9.5" fill="#CBD5E1">concurrent writes · pagination</text>
  </g>

  <!-- Tech Stack Strip -->
  <text x="28" y="252" class="mono" font-size="10.5" font-weight="600" fill="#CBD5E1">
    <tspan fill="#7DD3FC">React</tspan> · <tspan fill="#7DD3FC">Spring Boot</tspan> · <tspan fill="#C084FC">MySQL</tspan> · <tspan fill="#F472B6">JWT</tspan> · Railway · Vercel
  </text>
</g>
<rect x="1" y="1" width="443" height="283" rx="17" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
