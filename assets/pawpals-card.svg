<svg width="445" height="275" viewBox="0 0 445 275" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">PawPals — a social network for dog owners</title>
<desc id="d">Light-mode product card for PawPals, marked shipped and offline. PawPals is a full-stack social network for dog owners with profiles, posts, follows, reactions and playdate scheduling, built with React, Spring Boot, MySQL, JWT, Railway and Vercel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="445" y2="275" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F6F7FB"/>
    <stop offset="1" stop-color="#ECEEF9"/>
  </linearGradient>
  <radialGradient id="gl" cx="360" cy="50" r="220" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#8DABCA" stop-opacity=".38"/>
    <stop offset="1" stop-color="#8DABCA" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".90"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity=".75"/>
  </linearGradient>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#0E1024" fill-opacity=".07"/>
  </pattern>
  <clipPath id="clip"><rect width="445" height="275" rx="20"/></clipPath>
  <style><![CDATA[
    .sans { font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', Consolas, monospace; }
  ]]></style>
</defs>

<g clip-path="url(#clip)">
  <rect width="445" height="275" fill="url(#bg)"/>
  <rect width="445" height="275" fill="url(#gl)"/>
  <rect width="445" height="275" fill="url(#dots)"/>

  <g transform="translate(24 22)">
    <rect width="164" height="24" rx="12" fill="#FFFFFF" stroke="#8DABCA" stroke-opacity=".5"/>
    <circle cx="14" cy="12" r="3.5" fill="#4174A6"/>
    <text x="25" y="16" class="mono" font-size="10" font-weight="700" fill="#125190">FULL-STACK · SOCIAL</text>

    <rect x="332" y="0" width="65" height="24" rx="12" fill="#EEF2F8" stroke="#CBD5E1"/>
    <text x="364.5" y="15.5" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#545A75">offline</text>

    <text x="0" y="68" class="sans" font-size="38" font-weight="900" letter-spacing="-1" fill="#0E1024">PawPals</text>
    <text x="0" y="92" class="sans" font-size="14.5" font-weight="700" fill="#125190">A social network for dog owners</text>
    <text x="0" y="112" class="sans" font-size="12.5" fill="#545A75">Profiles · posts · follows · reactions · playdates</text>

    <!-- Frosted Glass Relational Graph Box -->
    <g transform="translate(0 126)">
      <rect width="397" height="62" rx="14" fill="url(#glass)" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x=".75" y=".75" width="395.5" height="60.5" rx="13.25" fill="none" stroke="#125190" stroke-opacity=".12"/>
      <text x="16" y="20" class="mono" font-size="9.5" font-weight="700" fill="#545A75">AUTH · RELATIONAL OWNERSHIP · CONCURRENT WRITES · PAGINATION</text>
      <g stroke="#4174A6" stroke-width="1.5" fill="none">
        <path d="M32 42 C70 30, 110 30, 148 42"/>
        <path d="M148 42 C186 52, 226 52, 264 42"/>
        <path d="M264 42 C302 30, 336 30, 368 42"/>
      </g>
      <circle cx="32" cy="42" r="5" fill="#FFFFFF" stroke="#125190" stroke-width="2"/>
      <circle cx="148" cy="42" r="5" fill="#125190"/>
      <circle cx="264" cy="42" r="5" fill="#FFFFFF" stroke="#125190" stroke-width="2"/>
      <circle cx="368" cy="42" r="5" fill="#067647"/>
    </g>

    <text x="0" y="216" class="mono" font-size="11" font-weight="600" fill="#0E1024">React <tspan fill="#8DABCA">·</tspan> Spring Boot <tspan fill="#8DABCA">·</tspan> MySQL <tspan fill="#8DABCA">·</tspan> JWT <tspan fill="#8DABCA">·</tspan> Railway <tspan fill="#8DABCA">·</tspan> Vercel</text>
  </g>
</g>
<rect x=".75" y=".75" width="443.5" height="273.5" rx="19.25" fill="none" stroke="#D5E0F0" stroke-width="1.5"/>
</svg>