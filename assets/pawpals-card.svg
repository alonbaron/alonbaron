<svg width="445" height="275" viewBox="0 0 445 275" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">PawPals — a social network for dog owners</title>
<desc id="d">A live product card for PawPals, a full-stack social network for dog owners with profiles, posts, follows, reactions and playdates, built with React, Spring Boot, MySQL, JWT, Railway and Vercel.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="445" y2="275" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0E0B1C"/><stop offset="1" stop-color="#140A1B"/>
  </linearGradient>
  <linearGradient id="nm" x1="34" y1="0" x2="320" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#A78BFA"/><stop offset=".55" stop-color="#E879F9"/><stop offset="1" stop-color="#F472B6"/>
  </linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(360 30) scale(220 180)">
    <stop stop-color="#A78BFA" stop-opacity=".26"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#3A2A55" stroke-width=".6" stroke-opacity=".45"/>
  </pattern>
  <filter id="gw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <clipPath id="card"><rect x="6" y="6" width="433" height="263" rx="16"/></clipPath>
  <style><![CDATA[
    .mono{font-family:ui-monospace,'Cascadia Code','Segoe UI Mono',Consolas,monospace}
    .sans{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
    .nmk{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;font-weight:800;font-size:46px;letter-spacing:.5px}
    .dot{animation:p 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .ring{animation:r 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
    .heart{animation:beat 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .e1{animation:flow 2.6s ease-in-out infinite}
    .e2{animation:flow 2.6s ease-in-out .5s infinite}
    .e3{animation:flow 2.6s ease-in-out 1s infinite}
    .e4{animation:flow 2.6s ease-in-out 1.5s infinite}
    @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
    @keyframes r{0%{opacity:.5;transform:scale(.7)}75%,100%{opacity:0;transform:scale(2.8)}}
    @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.16)}28%{transform:scale(1)}}
    @keyframes flow{0%,100%{stroke-opacity:.2}50%{stroke-opacity:.9}}
    @media (prefers-reduced-motion:reduce){.dot,.ring,.heart,.e1,.e2,.e3,.e4{animation:none}.ring{opacity:0}}
  ]]></style>
</defs>

<rect width="445" height="275" fill="url(#bg)"/>
<g clip-path="url(#card)">
  <rect width="445" height="275" fill="url(#grid)"/>
  <rect width="445" height="275" fill="url(#gl)"/>
</g>
<rect x="6" y="6" width="433" height="263" rx="16" fill="none" stroke="#34244F"/>
<g stroke="#C084FC" stroke-width="1.6" fill="none" stroke-linecap="round">
  <path d="M18 40V28a4 4 0 0 1 4-4h12"/>
  <path d="M427 40V28a4 4 0 0 0-4-4h-12"/>
  <path d="M18 235v12a4 4 0 0 0 4 4h12"/>
  <path d="M427 235v12a4 4 0 0 0-4 4h-12"/>
</g>

<!-- top bar -->
<g class="mono" font-size="11">
  <circle class="ring" cx="32" cy="40" r="4" fill="#34D399"/>
  <circle class="dot" cx="32" cy="40" r="4" fill="#34D399"/>
  <text x="44" y="44" fill="#34D399" font-weight="bold" letter-spacing="1.5">LIVE</text>
  <text x="413" y="44" text-anchor="end" fill="#D8B4FE" letter-spacing=".5">dogsocial.vercel.app</text>
</g>

<!-- name + copy -->
<text x="32" y="64" class="mono" font-size="11" letter-spacing="3" fill="#C084FC">FULL-STACK · SOCIAL</text>
<text x="30" y="118" class="nmk" fill="url(#nm)">PawPals</text>
<text x="32" y="142" class="sans" font-size="15" font-weight="600" fill="#E2D9F3">A social network for dog owners</text>
<text x="32" y="163" class="sans" font-size="12.5" fill="#9A8AB5">Profiles · posts · follows · playdates</text>

<!-- social graph motif -->
<g transform="translate(0 4)">
  <g stroke="#C084FC">
    <path class="e1" d="M250 196 L312 178"/>
    <path class="e2" d="M312 178 L372 196"/>
    <path class="e3" d="M250 196 L318 210"/>
    <path class="e4" d="M318 210 L372 196"/>
  </g>
  <circle cx="250" cy="196" r="11" fill="#1E1730" stroke="#C084FC" stroke-width="1.4"/>
  <circle cx="372" cy="196" r="11" fill="#1E1730" stroke="#C084FC" stroke-width="1.4"/>
  <circle cx="318" cy="210" r="8" fill="#1E1730" stroke="#A78BFA" stroke-width="1.2"/>
  <circle cx="312" cy="178" r="7" fill="#1E1730" stroke="#A78BFA" stroke-width="1.2"/>
  <path class="heart" d="M311 192c-9-6-16-12-16-20 0-6 7-10 12-5 1 1 3 3 4 4 1-1 3-3 4-4 5-5 12-1 12 5 0 8-7 14-16 20z" fill="#F472B6" filter="url(#gw)"/>
  <path class="heart" d="M311 192c-9-6-16-12-16-20 0-6 7-10 12-5 1 1 3 3 4 4 1-1 3-3 4-4 5-5 12-1 12 5 0 8-7 14-16 20z" fill="#F472B6"/>
</g>

<!-- tech -->
<text x="32" y="244" class="mono" font-size="11" fill="#A99BC4">React<tspan fill="#4A3D63"> · </tspan>Spring Boot<tspan fill="#4A3D63"> · </tspan>MySQL<tspan fill="#4A3D63"> · </tspan>JWT<tspan fill="#4A3D63"> · </tspan>Railway<tspan fill="#4A3D63"> · </tspan>Vercel</text>
</svg>
