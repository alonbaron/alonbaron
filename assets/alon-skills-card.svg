<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">alon-skills — six Claude Code skills and a build loop, measured with and without the plugin</title>
<desc id="d">Dark command-center card for claude-skills (alon-skills v3.2.2 + workflow-watch 0.4.1, MIT). Left: six skills (/architect, /review-swarm, /ask-the-council, /prompt-generator, /up-to-date, and /ponytail vendored from DietrichGebert/ponytail MIT) plus /alon-skills:build-loop. Right: selected eval case per skill on Fable 5.1 with and without the plugin (review-swarm 1.00 vs 0.40, ponytail vendored 0.90 vs 0.50, ask-the-council 1.00 vs 0.33, architect 1.00 vs 0.67, up-to-date 0.88 vs 0.62). 19/19 evals passing at 0.7 threshold; 120 trigger prompts, 0 false fires.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="400" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#050814"/>
    <stop offset=".5" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#0E1024"/>
  </linearGradient>
  <radialGradient id="gA" cx="180" cy="120" r="380" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#125190" stop-opacity=".42"/>
    <stop offset="1" stop-color="#125190" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gB" cx="740" cy="300" r="420" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#7C3AED" stop-opacity=".28"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="nm" x1="34" y1="100" x2="410" y2="160" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".4" stop-color="#7DD3FC"/>
    <stop offset=".75" stop-color="#38BDF8"/>
    <stop offset="1" stop-color="#A855F7"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#06B6D4"/>
    <stop offset=".5" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#131C38" stop-opacity=".9"/>
    <stop offset="1" stop-color="#0B1124" stop-opacity=".95"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38BDF8" stop-opacity=".6"/>
    <stop offset=".5" stop-color="#4174A6" stop-opacity=".28"/>
    <stop offset="1" stop-color="#A855F7" stop-opacity=".6"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#8DABCA" fill-opacity=".16"/>
  </pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#02040A" flood-opacity=".65"/>
  </filter>
  <clipPath id="clip">
    <rect width="900" height="400" rx="20"/>
  </clipPath>
  <style><![CDATA[
    .sans { font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: ui-monospace, 'Cascadia Code', 'SFMono-Regular', Menlo, Consolas, monospace; }
    .nmk { font-family: 'Manrope', 'Inter', 'Segoe UI', system-ui, sans-serif; font-weight: 900; font-size: 54px; letter-spacing: -1px; }
    .dot { animation: p 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring { animation: r 2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .grow { animation: g 1.1s cubic-bezier(.22,1,.36,1) both; transform-box: fill-box; transform-origin: left center; }
    .flow { stroke-dasharray: 8 110; animation: f 3s linear infinite; }
    @keyframes p { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.75); } }
    @keyframes r { 0% { opacity: .6; transform: scale(.75); } 80%,100% { opacity: 0; transform: scale(2.8); } }
    @keyframes g { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes f { to { stroke-dashoffset: -118; } }
    @media (prefers-reduced-motion: reduce) { .dot, .ring, .grow, .flow { animation: none; } .ring { opacity: 0; } }
  ]]></style>
</defs>

<g clip-path="url(#clip)">
  <rect width="900" height="400" fill="url(#bg)"/>
  <rect width="900" height="400" fill="url(#gA)"/>
  <rect width="900" height="400" fill="url(#gB)"/>
  <rect width="900" height="400" fill="url(#dots)"/>

  <!-- Blueprint Construction Lines & Neural Conduit -->
  <g stroke="#4174A6" stroke-opacity=".18" fill="none">
    <circle cx="210" cy="195" r="190" stroke-dasharray="4 6"/>
    <path d="M415 245 C442 245, 445 160, 466 160" stroke="#38BDF8" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M415 280 C442 280, 445 250, 466 250" stroke="#A855F7" stroke-opacity=".35" stroke-width="1.5"/>
    <path class="flow" d="M415 245 C442 245, 445 160, 466 160" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
    <path class="flow" d="M415 280 C442 280, 445 250, 466 250" stroke="#A855F7" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- HUD Corner Brackets -->
  <g stroke="#38BDF8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-opacity=".8">
    <path d="M18 42V24a5 5 0 0 1 5-5h18"/>
    <path d="M859 19h18a5 5 0 0 1 5 5v18"/>
    <path d="M882 358v18a5 5 0 0 1-5 5h-18"/>
    <path d="M41 381H23a5 5 0 0 1-5-5v-18"/>
  </g>

  <!-- Top Bar -->
  <g class="mono" font-size="11">
    <circle class="ring" cx="36" cy="38" r="4" fill="#10B981"/>
    <circle class="dot" cx="36" cy="38" r="4" fill="#10B981"/>
    <text x="48" y="42" fill="#34D399" font-weight="700" letter-spacing="1.5">CLAUDE CODE MARKETPLACE · 2 PLUGINS</text>
    <text x="866" y="42" text-anchor="end" fill="#7DD3FC" letter-spacing="1">alon-skills v3.2.2 · workflow-watch 0.4.1 · MIT</text>
  </g>

  <!-- Left Identity & Skills -->
  <text x="34" y="78" class="mono" font-size="10.5" letter-spacing="2.2" fill="#38BDF8">◢ CLI &amp; VS CODE EXTENSION · MACOS &amp; WINDOWS</text>
  <text x="32" y="136" class="nmk" fill="url(#nm)">alon-skills</text>
  <text x="34" y="168" class="sans" font-size="18.5" font-weight="800" fill="#F8FAFC">Claude Code skills, measured.</text>
  <text x="34" y="191" class="sans" font-size="13.5" fill="#94A3B8">6 skills + unattended build loop + live side-pane tracker</text>

  <!-- 6 Skills Grid -->
  <g class="mono" font-size="11.5" font-weight="600">
    <g transform="translate(34 208)">
      <rect width="102" height="28" rx="7" fill="#131C38" stroke="#38BDF8" stroke-opacity=".45"/>
      <text x="51" y="18" text-anchor="middle" fill="#7DD3FC">/architect</text>

      <rect x="110" width="122" height="28" rx="7" fill="#131C38" stroke="#38BDF8" stroke-opacity=".45"/>
      <text x="171" y="18" text-anchor="middle" fill="#7DD3FC">/review-swarm</text>

      <rect x="240" width="146" height="28" rx="7" fill="#131C38" stroke="#8B5CF6" stroke-opacity=".45"/>
      <text x="313" y="18" text-anchor="middle" fill="#C4B5FD">/ask-the-council</text>
    </g>
    <g transform="translate(34 244)">
      <rect width="148" height="28" rx="7" fill="#131C38" stroke="#6366F1" stroke-opacity=".45"/>
      <text x="74" y="18" text-anchor="middle" fill="#A5B4FC">/prompt-generator</text>

      <rect x="190" width="104" height="28" rx="7" fill="#131C38" stroke="#10B981" stroke-opacity=".45"/>
      <text x="242" y="18" text-anchor="middle" fill="#6EE7B7">/up-to-date</text>

      <rect x="302" width="112" height="28" rx="7" fill="#131C38" stroke="#EC4899" stroke-opacity=".45"/>
      <text x="358" y="18" text-anchor="middle" font-size="10.5" fill="#F9A8D4">/ponytail <tspan fill="#94A3B8" font-size="9.5">(MIT)</tspan></text>
    </g>
    <!-- Build loop pill -->
    <g transform="translate(34 280)">
      <rect width="380" height="28" rx="7" fill="#125190" fill-opacity=".28" stroke="#38BDF8" stroke-opacity=".5"/>
      <text x="190" y="18" text-anchor="middle" font-size="11" fill="#E2E8F0"><tspan fill="#38BDF8">/alon-skills:build-loop</tspan> · plan → spec → build → refute → fix → close</text>
    </g>
  </g>

  <!-- Right Eval Card -->
  <g transform="translate(462 58)" filter="url(#shadow)">
    <rect width="406" height="284" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5"/>
    <line x1="18" y1="1.5" x2="388" y2="1.5" stroke="#FFFFFF" stroke-opacity=".3"/>

    <text x="22" y="26" class="mono" font-size="11" font-weight="700" letter-spacing="1.8" fill="#7DD3FC">◢ EVAL CASES · FABLE 5.1</text>
    <g class="mono" font-size="10.5" fill="#CBD5E1">
      <rect x="262" y="17" width="10" height="8" rx="2" fill="url(#bar)"/>
      <text x="276" y="25">with</text>
      <rect x="316" y="17" width="10" height="8" rx="2" fill="#334155"/>
      <text x="330" y="25" fill="#94A3B8">without</text>
    </g>
    <line x1="22" y1="36" x2="384" y2="36" stroke="#1E293B"/>
    <text x="22" y="53" class="sans" font-size="11.5" fill="#94A3B8">One selected eval case per skill · 0.7 threshold</text>

    <!-- Bar Scale: 260px = 1.00 -->
    <!-- 1. review-swarm -->
    <g transform="translate(22 74)">
      <text y="0" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">review-swarm <tspan class="mono" font-size="10" font-weight="400" fill="#64748B">· N+1 query diff</tspan></text>
      <rect class="grow" y="7" width="260" height="7" rx="3.5" fill="url(#bar)" filter="url(#glow)"/>
      <rect y="17" width="104" height="4.5" rx="2.25" fill="#334155"/>
      <text x="362" y="14" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#38BDF8">1.00 <tspan fill="#64748B" font-size="10.5" font-weight="400">/ 0.40</tspan></text>
    </g>

    <!-- 2. ponytail (vendored) -->
    <g transform="translate(22 116)">
      <text y="0" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">ponytail (vendored) <tspan class="mono" font-size="10" font-weight="400" fill="#64748B">· one-caller cache</tspan></text>
      <rect class="grow" y="7" width="234" height="7" rx="3.5" fill="url(#bar)" filter="url(#glow)"/>
      <rect y="17" width="130" height="4.5" rx="2.25" fill="#334155"/>
      <text x="362" y="14" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#38BDF8">0.90 <tspan fill="#64748B" font-size="10.5" font-weight="400">/ 0.50</tspan></text>
    </g>

    <!-- 3. ask-the-council -->
    <g transform="translate(22 158)">
      <text y="0" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">ask-the-council <tspan class="mono" font-size="10" font-weight="400" fill="#64748B">· verdict + hand-off</tspan></text>
      <rect class="grow" y="7" width="260" height="7" rx="3.5" fill="url(#bar)" filter="url(#glow)"/>
      <rect y="17" width="86" height="4.5" rx="2.25" fill="#334155"/>
      <text x="362" y="14" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#38BDF8">1.00 <tspan fill="#64748B" font-size="10.5" font-weight="400">/ 0.33</tspan></text>
    </g>

    <!-- 4. architect -->
    <g transform="translate(22 200)">
      <text y="0" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">architect <tspan class="mono" font-size="10" font-weight="400" fill="#64748B">· feature spec from scratch</tspan></text>
      <rect class="grow" y="7" width="260" height="7" rx="3.5" fill="url(#bar)" filter="url(#glow)"/>
      <rect y="17" width="174" height="4.5" rx="2.25" fill="#334155"/>
      <text x="362" y="14" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#38BDF8">1.00 <tspan fill="#64748B" font-size="10.5" font-weight="400">/ 0.67</tspan></text>
    </g>

    <!-- 5. up-to-date -->
    <g transform="translate(22 242)">
      <text y="0" class="sans" font-size="12.5" font-weight="700" fill="#F8FAFC">up-to-date <tspan class="mono" font-size="10" font-weight="400" fill="#64748B">· unpushed branch vs main</tspan></text>
      <rect class="grow" y="7" width="229" height="7" rx="3.5" fill="url(#bar)" filter="url(#glow)"/>
      <rect y="17" width="161" height="4.5" rx="2.25" fill="#334155"/>
      <text x="362" y="14" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#38BDF8">0.88 <tspan fill="#64748B" font-size="10.5" font-weight="400">/ 0.62</tspan></text>
    </g>
  </g>

  <!-- Footer Telemetry Strip -->
  <g class="mono" font-size="11.5">
    <circle cx="38" cy="360" r="4" fill="#10B981"/>
    <text x="48" y="364" fill="#34D399" font-weight="700">19/19 evals passing</text>
    <text x="196" y="364" fill="#94A3B8">· 120 trigger prompts (75–100% fire rate · 0 false fires)</text>
    <text x="866" y="364" text-anchor="end" fill="#7DD3FC">github.com/alonbaron/claude-skills</text>
  </g>
</g>
<rect x="1" y="1" width="898" height="398" rx="19" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
