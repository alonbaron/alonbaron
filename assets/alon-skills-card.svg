  <text x="105" y="271" text-anchor="middle">/prompt-generator</text>
  <rect x="184" y="254" width="100" height="26" rx="7" fill="#FFFFFF" fill-opacity=".8" stroke="#C9D6EA"/>
  <text x="234" y="271" text-anchor="middle">/up-to-date</text>
  <rect x="292" y="254" width="86" height="26" rx="7" fill="#FFFFFF" fill-opacity=".8" stroke="#C9D6EA"/>
  <text x="335" y="271" text-anchor="middle">/ponytail</text>
</g>

<g class="mono" font-size="11.5">
  <circle cx="38" cy="342" r="4" fill="#059669"/>
  <text x="48" y="346" fill="#047857" font-weight="bold">19/19 evals passing</text>
  <text x="196" y="346" fill="#4A5B78"><tspan fill="#AFC3DD">· </tspan>120 trigger prompts<tspan fill="#AFC3DD"> · </tspan>0 false fires</text>
</g>

<rect x="466" y="56" width="400" height="278" rx="14" fill="#FFFFFF" fill-opacity=".88" stroke="#D2DFEE"/>
<text x="488" y="84" class="mono" font-size="11" letter-spacing="2" fill="#4A5B78">EVAL CASES</text>
<g class="mono" font-size="10.5" fill="#5B6B86">
  <rect x="712" y="76" width="10" height="10" rx="2" fill="url(#bar)"/>
  <text x="727" y="85">with</text>
  <rect x="774" y="76" width="10" height="10" rx="2" fill="#B8C4D6"/>
  <text x="789" y="85">without</text>
</g>
