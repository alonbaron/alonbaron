<svg width="900" height="384" viewBox="0 0 900 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">alon-skills — Claude Code skills, measured</title>
<desc id="d">Card for alon-skills v3.0.2, a Claude Code plugin with six skills and an unattended build loop. Selected eval cases, scored with and without the plugin: review-swarm 0.90 vs 0.40, ponytail 1.00 vs 0.40, ask-the-council 1.00 vs 0.17, architect 1.00 vs 0.67, up-to-date 1.00 vs 0.50. 19 of 19 eval cases pass; 120 trigger prompts, no false fires.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="900" y2="384" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F5F9FD"/><stop offset="1" stop-color="#EAF0FA"/>
  </linearGradient>
  <linearGradient id="nm" x1="30" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0891B2"/><stop offset=".5" stop-color="#0EA5E9"/><stop offset="1" stop-color="#6D28D9"/>
  </linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0891B2"/><stop offset=".55" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 40) scale(360 260)">
    <stop stop-color="#4F46E5" stop-opacity=".12"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#C4D3E6" stroke-width=".6" stroke-opacity=".5"/>
  </pattern>
  <clipPath id="card"><rect x="6" y="6" width="888" height="372" rx="18"/></clipPath>
  <style><![CDATA[
    .mono{font-family:ui-monospace,'Cascadia Code','Segoe UI Mono',Consolas,monospace}
    .sans{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif}
    .nmk{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;font-weight:800;font-size:58px;letter-spacing:.5px}
    .dot{animation:p 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .ring{animation:r 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
    .grow{animation:g 1.1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
    @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
    @keyframes r{0%{opacity:.55;transform:scale(.7)}75%,100%{opacity:0;transform:scale(2.8)}}
    @keyframes g{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.dot,.ring,.grow{animation:none}.ring{opacity:0}}
  ]]></style>
</defs>

<rect width="900" height="384" fill="url(#bg)"/>
<g clip-path="url(#card)">
  <rect width="900" height="384" fill="url(#grid)"/>
  <rect width="900" height="384" fill="url(#gl)"/>
</g>
<rect x="6" y="6" width="888" height="372" rx="18" fill="none" stroke="#D2DFEE"/>
<g stroke="#4F46E5" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-opacity=".9">
  <path d="M18 40V28a4 4 0 0 1 4-4h12"/>
  <path d="M882 40V28a4 4 0 0 0-4-4h-12"/>
  <path d="M18 344v12a4 4 0 0 0 4 4h12"/>
  <path d="M882 344v12a4 4 0 0 0-4 4h-12"/>
</g>

<g class="mono" font-size="11">
  <circle class="ring" cx="34" cy="40" r="4" fill="#059669"/>
  <circle class="dot" cx="34" cy="40" r="4" fill="#059669"/>
  <text x="46" y="44" fill="#047857" font-weight="bold" letter-spacing="1.5">OPEN SOURCE</text>
  <text x="866" y="44" text-anchor="end" fill="#4F46E5" letter-spacing="1">v3.0.2 · MIT</text>
</g>

<text x="34" y="80" class="mono" font-size="11" letter-spacing="3" fill="#4F46E5">CLAUDE CODE PLUGIN</text>
<text x="31" y="142" class="nmk" fill="url(#nm)">alon-skills</text>
<text x="34" y="176" class="sans" font-size="21" font-weight="700" fill="#233A57">Claude Code skills, measured.</text>
<text x="34" y="202" class="sans" font-size="14" fill="#5B6B86">6 skills + an unattended build loop</text>

<g class="mono" font-size="12" fill="#4F46E5">
  <rect x="34" y="220" width="92" height="26" rx="7" fill="#FFFFFF" fill-opacity=".8" stroke="#C9D6EA"/>
  <text x="80" y="237" text-anchor="middle">/architect</text>
  <rect x="134" y="220" width="114" height="26" rx="7" fill="#FFFFFF" fill-opacity=".8" stroke="#C9D6EA"/>
  <text x="191" y="237" text-anchor="middle">/review-swarm</text>
